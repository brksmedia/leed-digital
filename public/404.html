<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada | LEED</title>
    <style>
      :root {
        color: #11130f;
        background: #f3f1ea;
        font-family: Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 720px);
        border-top: 1px solid currentColor;
        padding-top: 32px;
      }

      p {
        max-width: 52ch;
        font-size: 1.125rem;
        line-height: 1.5;
      }

      h1 {
        margin: 0 0 24px;
        font-size: clamp(3rem, 10vw, 7rem);
        line-height: 0.92;
        letter-spacing: -0.06em;
      }

      a {
        display: inline-block;
        margin-top: 24px;
        color: inherit;
        font-weight: 700;
        text-underline-offset: 5px;
      }

      a:focus-visible {
        outline: 3px solid #2057ff;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>A página que você procurou não existe ou mudou de endereço.</p>
      <a href="/">Voltar para a página inicial</a>
    </main>
  </body>
</html>
